name: Offline CAD core tests
on:
  push:
    paths-ignore:
      - 'README.md'
      - 'README_EN.md'
      - 'assets/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'README_EN.md'
      - 'assets/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Poppler on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install ".[intake]"
      - run: python -m unittest discover -s tests -v
      - run: python -m omnicad --help
