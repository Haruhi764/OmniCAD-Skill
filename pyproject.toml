[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicad-skill"
version = "1.0.0"
description = "Evidence-driven CAD drafting and revision tools for Codex"
readme = "README_EN.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["ezdxf>=1.4,<2"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
intake = ["pypdf>=5,<7", "Pillow>=10"]
autocad = ["pywin32>=306; platform_system == 'Windows'"]

[project.scripts]
omnicad = "omnicad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
