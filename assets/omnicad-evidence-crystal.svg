<text x="522" y="212" fill="#82d4fa" font-size="14">Entity boundary</text>
<rect x="271" y="346" width="172" height="23" rx="3" fill="#0e2030"/>
<text x="357" y="363" fill="#82d4fa" text-anchor="middle" font-size="15" font-weight="700">Actual measurement</text>
<text x="58" y="389" fill="#b7cbd9" font-size="14">Compare measured values with the reviewed contract, not label text alone.</text>
<rect x="709" y="158" width="453" height="247" rx="6" fill="#101e2c" stroke="#344d60"/>
<text x="729" y="184" fill="#82d4fa" font-size="13" font-weight="700" letter-spacing="2">02 / ACCEPTANCE GATE</text>
<rect x="729" y="198" width="413" height="51" rx="4" fill="#152637" stroke="#30485b"/><rect x="729" y="198" width="4" height="51" rx="2" fill="#f4ad9c"/><text x="745" y="218" fill="#f4ad9c" font-size="13" font-weight="700" letter-spacing="1.3">FAILED</text><text x="745" y="236" fill="#b7cbd9" font-size="13">Hard error</text><text x="1126" y="228" fill="#e2edf4" font-size="15" text-anchor="end">Correct and recheck</text><rect x="729" y="258" width="413" height="51" rx="4" fill="#152637" stroke="#30485b"/><rect x="729" y="258" width="4" height="51" rx="2" fill="#f1cd87"/><text x="745" y="278" fill="#f1cd87" font-size="13" font-weight="700" letter-spacing="1.3">PENDING</text><text x="745" y="296" fill="#b7cbd9" font-size="13">Missing evidence</text><text x="1126" y="288" fill="#e2edf4" font-size="15" text-anchor="end">Collect / review</text><rect x="729" y="318" width="413" height="51" rx="4" fill="#152637" stroke="#30485b"/><rect x="729" y="318" width="4" height="51" rx="2" fill="#8dd9b7"/><text x="745" y="338" fill="#8dd9b7" font-size="13" font-weight="700" letter-spacing="1.3">PASSED</text><text x="745" y="356" fill="#b7cbd9" font-size="13">Required checks satisfied</text><text x="1126" y="348" fill="#e2edf4" font-size="15" text-anchor="end">Eligible for delivery</text>
<path d="M38 427H1162" stroke="#344d60"/>
<text x="38" y="453" fill="#82d4fa" font-size="12" font-weight="700" letter-spacing="2">01</text><text x="66" y="454" fill="#eaf3fa" font-size="17" font-weight="700" letter-spacing="1">REQUIREMENTS</text><text x="66" y="477" fill="#a7bac9" font-size="15">Reviewed constraints</text><path d="M283 454h22m-5-5 5 5-5 5" fill="none" stroke="#52758b" stroke-width="1.5"/><text x="330" y="453" fill="#82d4fa" font-size="12" font-weight="700" letter-spacing="2">02</text><text x="358" y="454" fill="#eaf3fa" font-size="17" font-weight="700" letter-spacing="1">DRAFT</text><text x="358" y="477" fill="#a7bac9" font-size="15">Editable CAD entities</text><path d="M575 454h22m-5-5 5 5-5 5" fill="none" stroke="#52758b" stroke-width="1.5"/><text x="622" y="453" fill="#82d4fa" font-size="12" font-weight="700" letter-spacing="2">03</text><text x="650" y="454" fill="#eaf3fa" font-size="17" font-weight="700" letter-spacing="1">VERIFY</text><text x="650" y="477" fill="#a7bac9" font-size="15">OQA / native / review</text><path d="M867 454h22m-5-5 5 5-5 5" fill="none" stroke="#52758b" stroke-width="1.5"/><text x="914" y="453" fill="#82d4fa" font-size="12" font-weight="700" letter-spacing="2">04</text><text x="942" y="454" fill="#eaf3fa" font-size="17" font-weight="700" letter-spacing="1">DELIVER</text><text x="942" y="477" fill="#a7bac9" font-size="15">Drawing + evidence</text>
<text x="38" y="510" fill="#829bad" font-size="12" letter-spacing=".5">WORKFLOW ILLUSTRATION / NOT A TEST REPORT OR A DRAWING TO SCALE</text>
<text x="1162" y="510" fill="#829bad" font-size="12" text-anchor="end">HUMAN ENGINEERING REVIEW REQUIRED</text>
</g></svg>