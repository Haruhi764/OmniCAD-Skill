<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
<title id="title">OmniCAD evidence-driven verification</title>
<desc id="desc">Illustrative CAD geometry and acceptance logic: compare measured geometry against requirements, correct failures, collect missing evidence and release only when required checks pass.</desc>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#284154" stroke-width=".7"/></pattern>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V8" stroke="#5b8298" stroke-width="1"/></pattern>
  <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5 0 7Z" fill="#82d4fa"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="528" rx="14" fill="#0b1724" stroke="#324c60" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif">
<g transform="translate(38 15) scale(.21)"><rect x="1" y="1" width="158" height="158" rx="30" fill="#0b1724" stroke="#34556b" stroke-width="2"/><g fill="none" stroke-linejoin="round"><path d="M80 23L129.36 51.5V108.5L80 137 30.64 108.5V51.5Z" stroke="#547c94" stroke-width="1.4"/><circle cx="80" cy="80" r="45" stroke="#547c94" stroke-width="1" stroke-dasharray="2 4"/><path d="M111.82 48.18A45 45 0 1 0 111.82 111.82" stroke="#e6f4fc" stroke-width="6" stroke-linecap="square"/><path d="M103.33 56.67A33 33 0 1 0 103.33 103.33" stroke="#82d4fa" stroke-width="3.5" stroke-linecap="square"/><g stroke-linejoin="round"><path d="M80 58L99.05 69V91L80 102 60.95 91V69Z" stroke="#82d4fa" stroke-width="2"/><path d="M80 58L99.05 69 80 80 60.95 69Z" fill="#82d4fa" fill-opacity=".25" stroke="none"/><path d="M80 58V80L99.05 91M60.95 91L80 80" stroke="#e6f4fc" stroke-width="1.5"/><circle cx="80" cy="80" r="2.5" fill="#e6f4fc" stroke="none"/></g><path d="M80 12V23M80 137V148M19 80H30.64M129.36 80H141" stroke="#82d4fa" stroke-width="1.5"/><path d="M80 27V34M80 126V133M27 80H34M126 80H133" stroke="#82d4fa" stroke-width="1"/></g><g fill="#82d4fa"><rect x="77.5" y="20.5" width="5" height="5"/><rect x="77.5" y="134.5" width="5" height="5"/><rect x="28.14" y="77.5" width="5" height="5"/><rect x="126.86" y="77.5" width="5" height="5"/></g></g><text x="83" y="40" fill="#82d4fa" font-size="14" font-weight="700" letter-spacing="3">OMNICAD / VERIFICATION SYSTEM</text>
<text x="1162" y="40" fill="#a7bac9" font-size="13" text-anchor="end" letter-spacing="2">METHOD / 01</text>
<text x="36" y="90" fill="#f3f8fc" font-size="43" font-weight="700">Evidence-driven engineering</text>
<text x="38" y="119" fill="#a7bac9" font-size="19">Measure the geometry. Check the requirements. Preserve the evidence.</text>
<path d="M38 140H1162" stroke="#344d60"/>
<rect x="38" y="158" width="653" height="247" rx="6" fill="#0e2030" stroke="#344d60"/>
<rect x="39" y="159" width="651" height="245" rx="5" fill="url(#grid)"/>
<text x="58" y="184" fill="#82d4fa" font-size="13" font-weight="700" letter-spacing="2">01 / GEOMETRY &amp; DIMENSIONS</text>
<text x="671" y="184" fill="#9aafbf" font-size="12" text-anchor="end">SCHEMATIC</text>
<g fill="none" stroke-linejoin="round">
  <path d="M105 254H196V225H383V244H526V260H609V302H526V318H383V337H196V308H105Z" stroke="#dcecf7" stroke-width="2.5" fill="#152d40"/>
  <path d="M196 225H383V244H526V260H609V281H196Z" fill="url(#hatch)" stroke="none" opacity=".55"/>
  <path d="M196 225V337M383 225V337M526 244V318" stroke="#dcecf7" stroke-width="1.5"/>
  <path d="M78 281H637" stroke="#73b2d3" stroke-width="1" stroke-dasharray="15 5 3 5"/>
  <path d="M105 311V366M609 305V366" stroke="#82d4fa" stroke-width="1"/>
  <path d="M105 358H609" stroke="#82d4fa" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M383 225V208H514" stroke="#82d4fa" stroke-width="1.2"/>
  <circle cx="383" cy="225" r="4" fill="#82d4fa" stroke="none"/>
